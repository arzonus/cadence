# Warm storage replication scenario (see research/replication-lag.md).
# Run: ./simulation/replication/run.sh --scenario warmlagreset
# The dynamic config config/dynamicconfig/replication_simulation_warmlagreset.yml turns system.enableWarmStorage on in both clusters.
# (e) the standby catches up after a 180s cut, a forced failover (a graceful one fails with a failed-to-verify-failover-version error with the flag on and off alike) makes cluster1 active, then cluster1 resets two runs that are Warm on cluster0. A reset on cluster1 during the cut hangs for 10s with the flag on and off alike, so it isn't used.

clusters:
  cluster0:
    grpcEndpoint: "cadence-cluster0:7833"
  cluster1:
    grpcEndpoint: "cadence-cluster1:7833"

primaryCluster: "cluster0"

domains:
  test-domain:
    activeClusterName: cluster0

operations:
  - op: start_workflow
    at: 0s
    workflowType: activity-loop-workflow
    workflowID: rs-long
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 6
  - op: start_workflow
    at: 0s
    workflowType: activity-loop-workflow
    workflowID: rs-warm
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 1
  - op: marker
    at: 14s
    marker: lag-cut
  - op: validate
    at: 60s
    workflowID: rs-long
    cluster: cluster0
    domain: test-domain
    want:
      status: completed
  - op: marker
    at: 190s
    marker: lag-restore
  - op: compare_clusters
    at: 200s
    workflowID: rs-long
    sourceCluster: cluster0
    targetCluster: cluster1
    domain: test-domain
  - op: compare_clusters
    at: 200s
    workflowID: rs-warm
    sourceCluster: cluster0
    targetCluster: cluster1
    domain: test-domain
  - op: marker
    at: 225s
    marker: rows-before-failover
  - op: change_active_clusters
    at: 230s
    domain: test-domain
    newActiveCluster: cluster1
  - op: reset_workflow
    at: 250s
    workflowID: rs-warm
    cluster: cluster1
    domain: test-domain
    eventID: 4
  - op: reset_workflow
    at: 252s
    workflowID: rs-long
    cluster: cluster1
    domain: test-domain
    eventID: 4
  - op: compare_clusters
    at: 285s
    workflowID: rs-long
    sourceCluster: cluster0
    targetCluster: cluster1
    domain: test-domain
  - op: compare_clusters
    at: 285s
    workflowID: rs-warm
    sourceCluster: cluster0
    targetCluster: cluster1
    domain: test-domain
  - op: validate
    at: 285s
    workflowID: rs-long
    cluster: cluster0
    domain: test-domain
    want:
      status: completed
  - op: validate
    at: 285s
    workflowID: rs-warm
    cluster: cluster1
    domain: test-domain
    want:
      status: completed
  - op: validate_dlq_empty
    at: 320s
    cluster: cluster0
  - op: validate_dlq_empty
    at: 320s
    cluster: cluster1
  - op: marker
    at: 322s
    marker: rows-final
