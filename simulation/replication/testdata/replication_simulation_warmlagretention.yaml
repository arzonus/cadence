# Warm storage replication scenario (see research/replication-lag.md).
# Run: ./simulation/replication/run.sh --scenario warmlagretention
# The dynamic config config/dynamicconfig/replication_simulation_warmlagretention.yml turns system.enableWarmStorage on in both clusters.
# (d) domain retention is 0 days, so retention deletes closed runs on the active (cluster0) while cluster1 is cut off for 180s.

clusters:
  cluster0:
    grpcEndpoint: "cadence-cluster0:7833"
  cluster1:
    grpcEndpoint: "cadence-cluster1:7833"

primaryCluster: "cluster0"

domains:
  test-domain:
    activeClusterName: cluster0
    retentionDays: 0

operations:
  - op: start_workflow
    at: 0s
    workflowType: activity-loop-workflow
    workflowID: ret-complete
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 2
  - op: start_workflow
    at: 0s
    workflowType: fail-workflow
    workflowID: ret-fail
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
  - op: start_workflow
    at: 0s
    workflowType: activity-loop-workflow
    workflowID: ret-running
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 10
  - op: marker
    at: 3s
    marker: lag-cut
  - op: marker
    at: 100s
    marker: rows-after-retention-active
  - op: marker
    at: 186s
    marker: lag-restore
  - op: marker
    at: 200s
    marker: rows-after-restore
  - op: validate_dlq_empty
    at: 230s
    cluster: cluster0
  - op: validate_dlq_empty
    at: 230s
    cluster: cluster1
  - op: marker
    at: 232s
    marker: rows-final
