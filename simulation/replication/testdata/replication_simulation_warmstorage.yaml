# Warm storage replication scenario (see research/replication-lag.md).
# Run: ./simulation/replication/run.sh --scenario warmstorage
# The dynamic config config/dynamicconfig/replication_simulation_warmstorage.yml turns system.enableWarmStorage on in both clusters.
# Close kinds with warm storage on in both clusters, no lag: complete, fail, timeout, terminate, continue as new, cron.

clusters:
  cluster0:
    grpcEndpoint: "cadence-cluster0:7833"
  cluster1:
    grpcEndpoint: "cadence-cluster1:7833"

primaryCluster: "cluster0"

domains:
  test-domain:
    activeClusterName: cluster0

operations:
  - op: start_workflow
    at: 0s
    workflowType: activity-loop-workflow
    workflowID: ws-complete
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 2
  - op: start_workflow
    at: 0s
    workflowType: fail-workflow
    workflowID: ws-fail
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
  - op: start_workflow
    at: 0s
    workflowType: activity-loop-workflow
    workflowID: ws-timeout
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 8s
    activityCount: 20
  - op: start_workflow
    at: 0s
    workflowType: activity-loop-workflow
    workflowID: ws-terminate
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 20
  - op: terminate_workflow
    at: 6s
    workflowID: ws-terminate
    cluster: cluster0
    domain: test-domain
  - op: start_workflow
    at: 0s
    workflowType: continue-as-new-workflow
    workflowID: ws-can
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 2
  - op: start_workflow
    at: 0s
    workflowType: activity-loop-workflow
    workflowID: ws-cron
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 300s
    activityCount: 1
    cronSchedule: "* * * * *"
  - op: validate
    at: 30s
    workflowID: ws-complete
    cluster: cluster0
    domain: test-domain
    want:
      status: completed
  - op: validate
    at: 30s
    workflowID: ws-complete
    cluster: cluster1
    domain: test-domain
    want:
      status: completed
  - op: validate
    at: 30s
    workflowID: ws-fail
    cluster: cluster0
    domain: test-domain
    want:
      status: failed
  - op: validate
    at: 30s
    workflowID: ws-fail
    cluster: cluster1
    domain: test-domain
    want:
      status: failed
  - op: validate
    at: 30s
    workflowID: ws-timeout
    cluster: cluster0
    domain: test-domain
    want:
      status: timed-out
  - op: validate
    at: 30s
    workflowID: ws-timeout
    cluster: cluster1
    domain: test-domain
    want:
      status: timed-out
  - op: validate
    at: 30s
    workflowID: ws-terminate
    cluster: cluster0
    domain: test-domain
    want:
      status: terminated
  - op: validate
    at: 30s
    workflowID: ws-terminate
    cluster: cluster1
    domain: test-domain
    want:
      status: terminated
  - op: validate
    at: 30s
    workflowID: ws-can
    cluster: cluster0
    domain: test-domain
    want:
      status: completed
  - op: validate
    at: 30s
    workflowID: ws-can
    cluster: cluster1
    domain: test-domain
    want:
      status: completed
  - op: terminate_workflow
    at: 75s
    workflowID: ws-cron
    cluster: cluster0
    domain: test-domain
  - op: validate
    at: 85s
    workflowID: ws-cron
    cluster: cluster0
    domain: test-domain
    want:
      status: terminated
  - op: validate
    at: 85s
    workflowID: ws-cron
    cluster: cluster1
    domain: test-domain
    want:
      status: terminated
  - op: compare_clusters
    at: 90s
    workflowID: ws-complete
    sourceCluster: cluster0
    targetCluster: cluster1
    domain: test-domain
  - op: compare_clusters
    at: 90s
    workflowID: ws-fail
    sourceCluster: cluster0
    targetCluster: cluster1
    domain: test-domain
  - op: compare_clusters
    at: 90s
    workflowID: ws-timeout
    sourceCluster: cluster0
    targetCluster: cluster1
    domain: test-domain
  - op: compare_clusters
    at: 90s
    workflowID: ws-terminate
    sourceCluster: cluster0
    targetCluster: cluster1
    domain: test-domain
  - op: compare_clusters
    at: 90s
    workflowID: ws-can
    sourceCluster: cluster0
    targetCluster: cluster1
    domain: test-domain
  - op: compare_clusters
    at: 90s
    workflowID: ws-cron
    sourceCluster: cluster0
    targetCluster: cluster1
    domain: test-domain
  - op: validate_dlq_empty
    at: 100s
    cluster: cluster0
  - op: validate_dlq_empty
    at: 100s
    cluster: cluster1
  - op: marker
    at: 105s
    marker: rows-final
