# Warm storage replication scenario (see research/replication-lag.md).
# Run: ./simulation/replication/run.sh --scenario warmlaggraceful
# The dynamic config config/dynamicconfig/replication_simulation_warmlaggraceful.yml turns system.enableWarmStorage on in both clusters.
# (c) graceful failover (10s) issued on cluster1 while it is cut off for 180s.

clusters:
  cluster0:
    grpcEndpoint: "cadence-cluster0:7833"
  cluster1:
    grpcEndpoint: "cadence-cluster1:7833"

primaryCluster: "cluster0"

domains:
  test-domain:
    activeClusterName: cluster0

operations:
  - op: start_workflow
    at: 0s
    workflowType: activity-loop-workflow
    workflowID: fo-long
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 10
  - op: start_workflow
    at: 0s
    workflowType: activity-loop-workflow
    workflowID: fo-short
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 1
  - op: marker
    at: 12s
    marker: lag-cut
  - op: validate
    at: 70s
    workflowID: fo-long
    cluster: cluster0
    domain: test-domain
    want:
      status: completed
  - op: validate
    at: 70s
    workflowID: fo-short
    cluster: cluster0
    domain: test-domain
    want:
      status: completed
  - op: marker
    at: 72s
    marker: rows-active-moved
  - op: change_active_clusters
    at: 75s
    domain: test-domain
    newActiveCluster: cluster1
    cluster: cluster1
    failoverTimeoutSec: 10
  - op: validate
    at: 135s
    workflowID: fo-long
    cluster: cluster1
    domain: test-domain
    want:
      status: completed
  - op: marker
    at: 186s
    marker: lag-restore
  - op: compare_clusters
    at: 200s
    workflowID: fo-long
    sourceCluster: cluster0
    targetCluster: cluster1
    domain: test-domain
  - op: compare_clusters
    at: 200s
    workflowID: fo-short
    sourceCluster: cluster0
    targetCluster: cluster1
    domain: test-domain
  - op: validate_dlq_empty
    at: 280s
    cluster: cluster0
  - op: validate_dlq_empty
    at: 280s
    cluster: cluster1
  - op: marker
    at: 282s
    marker: rows-final
