# Warm storage replication scenario (see research/replication-lag.md).
# Run: ./simulation/replication/run.sh --scenario warmlag
# The dynamic config config/dynamicconfig/replication_simulation_warmlag.yml sets system.warmStorageMode to "on" in both clusters.
# (a)+(b): cluster1 is cut off for 180s (stands in for 3h, 60x). The active closes and moves runs; the standby catches up afterwards. Raw history (what the history resender reads) is read on the active during the lag.

clusters:
  cluster0:
    grpcEndpoint: "cadence-cluster0:7833"
  cluster1:
    grpcEndpoint: "cadence-cluster1:7833"

primaryCluster: "cluster0"

domains:
  test-domain:
    activeClusterName: cluster0

operations:
  - op: start_workflow
    at: 0s
    workflowType: activity-loop-workflow
    workflowID: pre-complete
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 2
  - op: start_workflow
    at: 0s
    workflowType: fail-workflow
    workflowID: pre-fail
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
  - op: start_workflow
    at: 0s
    workflowType: activity-loop-workflow
    workflowID: pre-timeout
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 8s
    activityCount: 20
  - op: start_workflow
    at: 0s
    workflowType: activity-loop-workflow
    workflowID: pre-terminate
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 20
  - op: terminate_workflow
    at: 6s
    workflowID: pre-terminate
    cluster: cluster0
    domain: test-domain
  - op: start_workflow
    at: 0s
    workflowType: continue-as-new-workflow
    workflowID: pre-can
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 2
  - op: start_workflow
    at: 0s
    workflowType: activity-loop-workflow
    workflowID: pre-running
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 12
  - op: marker
    at: 6s
    marker: lag-cut
  - op: start_workflow
    at: 10s
    workflowType: activity-loop-workflow
    workflowID: lag-complete
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 2
  - op: start_workflow
    at: 10s
    workflowType: fail-workflow
    workflowID: lag-fail
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
  - op: start_workflow
    at: 10s
    workflowType: activity-loop-workflow
    workflowID: lag-timeout
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 8s
    activityCount: 20
  - op: start_workflow
    at: 10s
    workflowType: activity-loop-workflow
    workflowID: lag-terminate
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 20
  - op: terminate_workflow
    at: 16s
    workflowID: lag-terminate
    cluster: cluster0
    domain: test-domain
  - op: start_workflow
    at: 10s
    workflowType: continue-as-new-workflow
    workflowID: lag-can
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 2
  - op: start_workflow
    at: 10s
    workflowType: activity-loop-workflow
    workflowID: lag-running
    cluster: cluster0
    domain: test-domain
    workflowExecutionStartToCloseTimeout: 400s
    activityCount: 12
  - op: validate
